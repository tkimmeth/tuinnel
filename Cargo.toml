[package]
name = "tuinnel"
version = "1.0.0"
edition = "2021"
description = "Universal VPN TUI for WireGuard and OpenVPN"
license = "MIT"
repository = "https://github.com/tkimmeth/tuinnel"

[[bin]]
name = "tuinnel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
log = "0.4.29"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
simplelog = "0.12.2"
toml = "1.0.1"
ureq = "2.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
