# ──────────────────────────────────────────────────────────────────────────────
# tuinnel configuration
# ──────────────────────────────────────────────────────────────────────────────
# Location: ~/.config/tuinnel/config.toml

[general]
# Directory containing VPN config files (empty = ~/.config/tuinnel/servers/).
servers_dir = ""

# Default connection strategy: first, random, preferred
default_connect = "first"

# Preferred protocol when both .conf and .ovpn exist: wireguard, openvpn
preferred_protocol = "wireguard"

# Automatically enable nftables kill switch when connecting.
kill_switch_on_connect = false

# Warn if kill switch is off before connecting.
warn_kill_switch = true

# Your location for the TUI globe marker (optional).
# user_lat = 40.71
# user_lon = -74.01

[preferred]
# Specific server config name (without extension) for --preferred.
# server = "us-nyc-001"

# Fallback: connect by country.
country = "US"

# Fallback: connect by city.
# city = "New York"

[autoconnect]
# Strategy for the systemd autoconnect service: first, random, preferred
strategy = "first"

# Seconds to wait for network connectivity before connecting.
wait_timeout = 30

[logging]
# Log level: DEBUG, INFO, WARN, ERROR
level = "INFO"
